services:
  postgres:
    image: postgres:17-alpine
    container_name: finsim-postgres
    environment:
      POSTGRES_DB: finsim
      POSTGRES_USER: finsim
      POSTGRES_PASSWORD: finsim
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsim -d finsim"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

