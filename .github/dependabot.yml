version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "com.diffplug.spotless"
      - dependency-name: "gradle"
      - dependency-name: "gradle-wrapper"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "actions/checkout"
