name: Conformance

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "samples/**"
      - "contract/**"
      - "scripts/conformance.sh"
      - ".github/workflows/conformance.yml"

permissions:
  contents: read

jobs:
  java-bank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Hurl
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2
          VERSION=$(curl -fsS https://api.github.com/repos/Orange-OpenSource/hurl/releases/latest | grep '"tag_name"' | cut -d '"' -f4)
          curl -fsSLO "https://github.com/Orange-OpenSource/hurl/releases/download/${VERSION}/hurl_${VERSION}_amd64.deb"
          sudo apt-get install -y "./hurl_${VERSION}_amd64.deb"
          hurl --version

      - name: Start the Java sample bank
        run: |
          ./gradlew :sample-bank-java:bootRun > bank.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:9001/finsim/v1/institution/health >/dev/null 2>&1; then
              echo "bank is up"; exit 0
            fi
            sleep 2
          done
          echo "bank did not start"; [ -f bank.log ] && cat bank.log; exit 1

      - name: Run the conformance suite
        run: scripts/conformance.sh http://localhost:9001

      - name: Show the bank log on failure
        if: failure()
        run: |
          if [ -f bank.log ]; then
            cat bank.log
          fi
