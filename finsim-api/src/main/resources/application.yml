spring:
  application:
    name: finsim
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finsim}
    username: ${SPRING_DATASOURCE_USERNAME:finsim}
    password: ${SPRING_DATASOURCE_PASSWORD:finsim}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

finsim:
  registry:
    allow-private-addresses: true   # local development; set false for shared deployments
    seed:
      enabled: true
      network-id: sandbox
      network-name: Sandbox
      currencies: [USD]
      institutions:
        - id: bank-a
          name: Bank A (sample, Java)
          type: BANK
          base-url: http://localhost:9001
          capabilities: [ACCOUNT_DEBIT, ACCOUNT_CREDIT, STATUS_QUERY]
        - id: bank-b
          name: Bank B (sample, Java)
          type: BANK
          base-url: http://localhost:9002
          capabilities: [ACCOUNT_DEBIT, ACCOUNT_CREDIT, STATUS_QUERY]

